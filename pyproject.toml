[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "observer-focus"
version = "0.1.0rc12"
description = "Local-first focus, posture, and phone-use observer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe==0.10.21",
    "numpy>=1.26.4,<2",
    "opencv-contrib-python>=4.10,<5",
    "psutil>=6.1,<8",
    "tzdata>=2026.1",
    "tzlocal>=5.3,<6",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8,<7",
]
# Keep the release/runtime install lightweight. YOLO evaluation uses CPU ONNX Runtime.
yolo = [
    "onnxruntime>=1.18,<2",
]

[project.scripts]
observer = "observer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
observer = ["default_config.json"]
